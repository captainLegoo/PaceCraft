name: Release Desktop Apps (macOS & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (如 v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-arm64"
            os: "macos-latest"
            target: "aarch64-apple-darwin"
            bun_target: "bun-darwin-arm64"
            sidecar_name: "server-aarch64-apple-darwin"

          - platform: "windows-x64"
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            bun_target: "bun-windows-x64"
            sidecar_name: "server-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Sync App Version from Tag
        shell: bash
        run: |
          RAW_VER="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '0.1.0' }}"
          VER="${RAW_VER#v}"
          echo "Syncing app version to $VER..."
          bun -e "
            const tauri = JSON.parse(await Bun.file('src-tauri/tauri.conf.json').text());
            tauri.version = '$VER';
            await Bun.write('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
            const pkg = JSON.parse(await Bun.file('package.json').text());
            pkg.version = '$VER';
            await Bun.write('package.json', JSON.stringify(pkg, null, 2));
            let cargo = await Bun.file('src-tauri/Cargo.toml').text();
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + '$VER' + '\"');
            await Bun.write('src-tauri/Cargo.toml', cargo);
          "

      - name: Build web frontend
        run: bun run build:web

      - name: Build backend sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          echo "Compiling backend to ${{ matrix.sidecar_name }}..."
          bun build --compile --minify --target=${{ matrix.bun_target }} ./server/src/index.ts --outfile src-tauri/binaries/${{ matrix.sidecar_name }}
          ls -lh src-tauri/binaries/

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
          releaseName: "PaceCraft ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}"
          releaseBody: |
            ## PaceCraft 跑者 AI 训练中心桌面客户端

            - **Windows**: 下载 `*.exe` 安装包安装运行
            - **macOS**: 下载 `*.dmg` 拖入 Applications 运行

            ### 特性说明
            - 跨手表生态数据聚合与 AI 训练助理，开箱即用，无需配置终端与 Node/Bun 环境
            - 数据全量仅持久化存储在个人电脑本地 (`~/.coros-dashboard`)，安全隐私绝对隔离
            - 支持多跑友独立档案共存切换与智能增量同步
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, 'test') || contains(github.ref_name, 'beta') }}
          args: --target ${{ matrix.target }}
