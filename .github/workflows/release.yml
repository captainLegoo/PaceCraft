name: Release Desktop Apps (macOS & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (如 v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-arm64"
            os: "macos-latest"
            target: "aarch64-apple-darwin"
            bun_target: "bun-darwin-arm64"
            sidecar_name: "server-aarch64-apple-darwin"

          - platform: "windows-x64"
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            bun_target: "bun-windows-x64"
            sidecar_name: "server-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Sync App Version from Tag
        shell: bash
        run: |
          RAW_VER="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '0.1.0' }}"
          VER="${RAW_VER#v}"
          # 强制标准化为合法 SemVer (X.Y.Z)，若为四段式 x.y.z.w 则自动转换为 x.y.z-w 防止 Tauri 解析报错
          if [[ "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VER="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-${BASH_REMATCH[4]}"
          fi

          # Tauri v2 严格要求 tauri.conf.json 的 version 必须为合法 3 段式 SemVer (X.Y.Z)
          # 且 Windows MSI WiX 要求不能含有 beta/alpha 等非数字字符
          # 因此将 tauri.conf.json 和 Cargo.toml 设为干净的标准 3 段式主版本号 (如 0.1.13)
          TAURI_VER="$VER"
          if [[ "$VER" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            TAURI_VER="${BASH_REMATCH[1]}"
          fi

          echo "Original version: $VER"
          echo "Tauri & Cargo SemVer: $TAURI_VER"
          bun -e "
            const tauri = JSON.parse(await Bun.file('src-tauri/tauri.conf.json').text());
            tauri.version = '$TAURI_VER';
            await Bun.write('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
            const pkg = JSON.parse(await Bun.file('package.json').text());
            pkg.version = '$VER';
            await Bun.write('package.json', JSON.stringify(pkg, null, 2));
            const webPkg = JSON.parse(await Bun.file('web/package.json').text());
            webPkg.version = '$VER';
            await Bun.write('web/package.json', JSON.stringify(webPkg, null, 2));
            const serverPkg = JSON.parse(await Bun.file('server/package.json').text());
            serverPkg.version = '$VER';
            await Bun.write('server/package.json', JSON.stringify(serverPkg, null, 2));
            let cargo = await Bun.file('src-tauri/Cargo.toml').text();
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + '$TAURI_VER' + '\"');
            await Bun.write('src-tauri/Cargo.toml', cargo);
          "

      - name: Build web frontend
        env:
          VITE_APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
        run: bun run build:web

      - name: Embed frontend assets into backend
        run: bun run scripts/bundle-dist.ts

      - name: Build backend sidecar binary
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          echo "Compiling backend to ${{ matrix.sidecar_name }}..."
          bun build --compile --minify --target=${{ matrix.bun_target }} ./server/src/index.ts --outfile src-tauri/binaries/${{ matrix.sidecar_name }}
          ls -lh src-tauri/binaries/

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          CURRENT_TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}"
          {
            echo "body<<EOF"
            bun run scripts/generate-release-notes.ts "$CURRENT_TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
          releaseName: "PaceCraft ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'test') }}
          args: --target ${{ matrix.target }}
